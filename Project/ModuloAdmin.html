<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitudes - CívicaYa</title>
  <link rel="stylesheet" href="/Project/css/estilos.css">
  <style>
    .encabezado-panel {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px 24px;
      margin-bottom: 18px;
    }

    .encabezado-panel h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .filtro {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .filtro label {
      margin: 0;
      white-space: nowrap;
    }

    .filtro select {
      width: auto;
      min-width: 220px;
    }

    .btn-accion {
      padding: 8px 14px;
      font-size: 0.85rem;
    }

    .btn-entregar {
      background: #c62828;
    }

    .btn-entregar:hover {
      background: #a01f1f;
    }

    @media (max-width: 520px) {
      .filtro {
        flex-direction: column;
        align-items: stretch;
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <header>
    <nav class="topbar">
      <a href="/Project/ModuloAdmin.html" class="activo">SOLICITUDES</a>
      <a href="/Project/Eliminados.html">ENTREGADAS</a>
      <a href="/logout">CERRAR SESIÓN</a>
    </nav>
    <div class="brandbar">
      <a class="brand" href="/Project/ModuloAdmin.html"><span>Cívica<b>Ya</b> · Administración</span></a>
      <img class="metro" src="/Project/img/logo-metro.jpg" alt="Metro de Medellín">
    </div>
    <div class="divider"></div>
  </header>

  <main>
    <div class="encabezado-panel">
      <h1>Solicitudes en curso</h1>
      <div class="filtro">
        <label for="filtroSucursal">Filtrar por PAC:</label>
        <select id="filtroSucursal">
          <option value="">Todos</option>
        </select>
      </div>
    </div>

    <div id="alerta" role="alert"></div>

    <div class="tabla-scroll">
      <table class="apilable">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Cédula</th>
            <th>Punto de atención</th>
            <th>Estado</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="tablaSolicitudes"></tbody>
      </table>
    </div>
  </main>

  <script src="/Project/js/util.js"></script>
  <script>
    const filtro = document.getElementById('filtroSucursal');
    const tbody = document.getElementById('tablaSolicitudes');
    const alerta = document.getElementById('alerta');

    // Cada estado tiene una única acción posible: PENDIENTE → CONFIRMADO → ENTREGADO
    const acciones = {
      PENDIENTE: { estado: 'CONFIRMADO', texto: 'Confirmar solicitud', clase: '' },
      CONFIRMADO: { estado: 'ENTREGADO', texto: 'Confirmar entrega', clase: 'btn-entregar' }
    };

    async function cargarSolicitudes() {
      let url = '/solicitudes-todas';
      if (filtro.value) url += '?sucursal=' + encodeURIComponent(filtro.value);

      const { ok, status, datos } = await pedirJSON(url);
      if (status === 401 || status === 403) return (window.location.href = '/Project/InicioSesion.html');
      if (!ok || !Array.isArray(datos)) {
        return mostrarAlerta(alerta, 'error', 'No se pudieron cargar las solicitudes.');
      }
      alerta.className = '';
      alerta.textContent = '';

      if (datos.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="vacio">No hay solicitudes en curso.</td></tr>';
        return;
      }
      tbody.innerHTML = datos.map((s) => {
        const accion = acciones[s.Estado];
        const boton = accion
          ? `<button class="btn btn-accion ${accion.clase}" data-cedula="${esc(s.Cedula)}" data-estado="${accion.estado}">${accion.texto}</button>`
          : '';
        return `
          <tr>
            <td data-label="Nombre">${esc(s.Nombre)}</td>
            <td data-label="Apellido">${esc(s.Apellido)}</td>
            <td data-label="Cédula">${esc(s.Cedula)}</td>
            <td data-label="Punto de atención">${esc(s.Nombre_Sucursal)}</td>
            <td data-label="Estado"><span class="estado estado-${esc(s.Estado)}">${esc(s.Estado)}</span></td>
            <td data-label="Acción">${boton}</td>
          </tr>`;
      }).join('');
    }

    async function cambiarEstado(cedula, nuevoEstado) {
      const { ok, datos } = await enviarJSON('/cambiar-estado', { cedula, estado: nuevoEstado });
      if (!ok) {
        mostrarAlerta(alerta, 'error', datos.mensaje || 'No se pudo actualizar el estado.');
        return cargarSolicitudes();
      }
      if (nuevoEstado === 'CONFIRMADO') {
        // Muestra la tarjeta lista para esta persona
        window.location.href = `/Project/civica.html?cedula=${encodeURIComponent(cedula)}`;
      } else {
        cargarSolicitudes();
      }
    }

    tbody.addEventListener('click', (e) => {
      const boton = e.target.closest('button[data-cedula]');
      if (!boton) return;
      boton.disabled = true;
      cambiarEstado(boton.dataset.cedula, boton.dataset.estado);
    });

    filtro.addEventListener('change', cargarSolicitudes);

    cargarPuntos(filtro).then(cargarSolicitudes);
  </script>
</body>

</html>
