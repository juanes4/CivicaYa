<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cívicas entregadas - CívicaYa</title>
  <link rel="stylesheet" href="/Project/css/estilos.css">
  <style>
    .encabezado-panel {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px 24px;
      margin-bottom: 18px;
    }

    .encabezado-panel h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .acciones-panel {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 20px;
    }

    .filtro {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .filtro label {
      margin: 0;
      white-space: nowrap;
    }

    .filtro select {
      width: auto;
      min-width: 220px;
    }

    @media (max-width: 520px) {
      .filtro {
        flex-direction: column;
        align-items: stretch;
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <header>
    <nav class="topbar">
      <a href="/Project/ModuloAdmin.html">SOLICITUDES</a>
      <a href="/Project/Eliminados.html" class="activo">ENTREGADAS</a>
      <a href="/logout">CERRAR SESIÓN</a>
    </nav>
    <div class="brandbar">
      <a class="brand" href="/Project/ModuloAdmin.html"><span>Cívica<b>Ya</b> · Administración</span></a>
      <img class="metro" src="/Project/img/logo-metro.jpg" alt="Metro de Medellín">
    </div>
    <div class="divider"></div>
  </header>

  <main>
    <div class="encabezado-panel">
      <h1>Cívicas entregadas</h1>
      <div class="acciones-panel">
        <a class="btn btn-secundario" href="/Project/ModuloAdmin.html">Ver solicitudes en curso</a>
        <div class="filtro">
          <label for="filtroSucursal">Filtrar por PAC:</label>
          <select id="filtroSucursal">
            <option value="">Todos</option>
          </select>
        </div>
      </div>
    </div>

    <div id="alerta" role="alert"></div>

    <div class="tabla-scroll">
      <table class="apilable">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Cédula</th>
            <th>Punto de atención</th>
            <th>Solicitud</th>
            <th>Tarifa</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody id="tablaSolicitudes"></tbody>
      </table>
    </div>
  </main>

  <script src="/Project/js/util.js"></script>
  <script>
    const filtro = document.getElementById('filtroSucursal');
    const tbody = document.getElementById('tablaSolicitudes');
    const alerta = document.getElementById('alerta');

    const MOTIVOS = { ROBO: 'Robo', PERDIDA: 'Pérdida', DANO: 'Daño' };
    const METODOS_PAGO = { PSE: 'PSE', EFECTIVO: 'Efectivo' };
    const TARIFAS = { ADULTO_MAYOR: 'Adulto mayor', DISCAPACIDAD: 'Discapacidad' };

    function describirSolicitud(s) {
      if (s.Primera_Vez !== 'NO') return 'Primera vez';
      const motivo = MOTIVOS[s.Motivo_Solicitud] || s.Motivo_Solicitud || '—';
      const pago = METODOS_PAGO[s.Metodo_Pago] || s.Metodo_Pago || '—';
      return `Reposición: ${motivo} · paga por ${pago}`;
    }

    async function cargarSolicitudes() {
      let url = '/solicitudes-Entregadas';
      if (filtro.value) url += '?sucursal=' + encodeURIComponent(filtro.value);

      const { ok, status, datos } = await pedirJSON(url);
      if (status === 401 || status === 403) return (window.location.href = '/Project/InicioSesion.html');
      if (!ok || !Array.isArray(datos)) {
        return mostrarAlerta(alerta, 'error', 'No se pudieron cargar las solicitudes.');
      }
      alerta.className = '';
      alerta.textContent = '';

      if (datos.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="vacio">Aún no hay Cívicas entregadas.</td></tr>';
        return;
      }
      tbody.innerHTML = datos.map((s) => `
        <tr>
          <td data-label="Nombre">${esc(s.Nombre)}</td>
          <td data-label="Apellido">${esc(s.Apellido)}</td>
          <td data-label="Cédula">${esc(s.Cedula)}</td>
          <td data-label="Punto de atención">${esc(s.Nombre_Sucursal)}</td>
          <td data-label="Solicitud">${esc(describirSolicitud(s))}</td>
          <td data-label="Tarifa">${esc(TARIFAS[s.Tipo_Tarifa] || 'Estándar')}</td>
          <td data-label="Estado"><span class="estado estado-${esc(s.Estado)}">${esc(s.Estado)}</span></td>
        </tr>`).join('');
    }

    filtro.addEventListener('change', cargarSolicitudes);

    cargarPuntos(filtro).then(cargarSolicitudes);
  </script>
</body>

</html>
