<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - CívicaYa</title>
  <link rel="stylesheet" href="/Project/css/estilos.css">
</head>

<body>
  <header>
    <nav class="topbar">
      <a href="/">INICIO</a>
      <a href="/Project/InicioSesion.html" class="activo">INICIAR SESIÓN</a>
      <a href="/Project/Registrarse.html">REGISTRARSE</a>
    </nav>
    <div class="brandbar">
      <a class="brand" href="/"><span>Cívica<b>Ya</b></span></a>
      <img class="metro" src="/Project/img/logo-metro.jpg" alt="Metro de Medellín">
    </div>
    <div class="divider"></div>
  </header>

  <main>
    <form class="card" action="/login" method="POST">
      <h2>Iniciar sesión</h2>
      <div id="alerta" role="alert"></div>

      <label class="requerido" for="correo">Correo</label>
      <input type="email" id="correo" name="correo" autocomplete="email" required>

      <label class="requerido" for="contrasena">Contraseña</label>
      <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" required>

      <button type="submit" class="btn btn-bloque">Entrar</button>

      <p class="enlaces">¿No tienes cuenta? <a href="/Project/Registrarse.html">Regístrate</a></p>
    </form>
  </main>

  <script src="/Project/js/util.js"></script>
  <script>
    if (new URLSearchParams(location.search).get('error')) {
      mostrarAlerta(document.getElementById('alerta'), 'error', 'Correo o contraseña incorrectos.');
    }
  </script>
</body>

</html>
