<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse - CívicaYa</title>
  <link rel="stylesheet" href="/Project/css/estilos.css">
</head>

<body>
  <header>
    <nav class="topbar">
      <a href="/">INICIO</a>
      <a href="/Project/InicioSesion.html">INICIAR SESIÓN</a>
      <a href="/Project/Registrarse.html" class="activo">REGISTRARSE</a>
    </nav>
    <div class="brandbar">
      <a class="brand" href="/"><span>Cívica<b>Ya</b></span></a>
      <img class="metro" src="/Project/img/logo-metro.jpg" alt="Metro de Medellín">
    </div>
    <div class="divider"></div>
  </header>

  <main>
    <form id="formRegistro" class="card" novalidate>
      <h2>Crear cuenta</h2>
      <div id="alerta" role="alert"></div>

      <label class="requerido" for="correo">Correo</label>
      <input type="email" id="correo" name="correo" autocomplete="email" required>

      <label class="requerido" for="contrasena">Contraseña</label>
      <input type="password" id="contrasena" name="contrasena" autocomplete="new-password" minlength="6" required>

      <label class="requerido" for="confirmar">Confirmar contraseña</label>
      <input type="password" id="confirmar" name="confirmar" autocomplete="new-password" required>

      <button type="submit" class="btn btn-bloque">Registrarme</button>

      <p class="enlaces">¿Ya tienes cuenta? <a href="/Project/InicioSesion.html">Inicia sesión</a></p>
    </form>
  </main>

  <script src="/Project/js/util.js"></script>
  <script>
    const form = document.getElementById('formRegistro');
    const alerta = document.getElementById('alerta');
    const boton = form.querySelector('button');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const correo = form.correo.value.trim();
      const contrasena = form.contrasena.value;
      const confirmar = form.confirmar.value;

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) return mostrarAlerta(alerta, 'error', 'Ingresa un correo válido.');
      if (contrasena.length < 6) return mostrarAlerta(alerta, 'error', 'La contraseña debe tener al menos 6 caracteres.');
      if (contrasena !== confirmar) return mostrarAlerta(alerta, 'error', 'Las contraseñas no coinciden.');

      boton.disabled = true;
      try {
        const { ok, datos } = await enviarJSON('/registrar', { correo, contrasena, confirmar });
        if (ok && datos.redirect) {
          mostrarAlerta(alerta, 'exito', datos.mensaje || 'Registro completado.');
          setTimeout(() => { window.location.href = datos.redirect; }, 1200);
        } else {
          mostrarAlerta(alerta, 'error', datos.mensaje || 'No se pudo completar el registro.');
          boton.disabled = false;
        }
      } catch {
        mostrarAlerta(alerta, 'error', 'No se pudo conectar con el servidor.');
        boton.disabled = false;
      }
    });
  </script>
</body>

</html>
