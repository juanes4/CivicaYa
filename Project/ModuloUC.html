<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi solicitud - CívicaYa</title>
  <link rel="stylesheet" href="/Project/css/estilos.css">
  <style>
    .aviso {
      margin: 0 0 18px;
      text-align: center;
    }

    .card table {
      margin-top: 8px;
    }

    .card th {
      width: 38%;
      text-transform: none;
      letter-spacing: 0;
      font-size: 0.9rem;
    }

    .codigo {
      font-family: Consolas, monospace;
      letter-spacing: 0.05em;
      word-break: break-all;
    }
  </style>
</head>

<body>
  <header>
    <nav class="topbar">
      <a href="/">INICIO</a>
      <a href="/Project/ModuloUC.html" class="activo">MI SOLICITUD</a>
      <a href="/logout">CERRAR SESIÓN</a>
    </nav>
    <div class="brandbar">
      <a class="brand" href="/"><span>Cívica<b>Ya</b></span></a>
      <img class="metro" src="/Project/img/logo-metro.jpg" alt="Metro de Medellín">
    </div>
    <div class="divider"></div>
  </header>

  <main>
    <section id="info" class="card ancha" hidden>
      <h2>Información de tu solicitud</h2>
      <p id="aviso" class="aviso"></p>
      <table>
        <tbody id="datosSolicitud"></tbody>
      </table>
      <p class="enlaces" id="otraSolicitud" hidden><a href="/Project/ModuloUser.html">Solicitar otra Cívica</a></p>
    </section>

    <section id="noSolicitud" class="card ancha" hidden>
      <h2>Aún no tienes una solicitud</h2>
      <p class="aviso">Diligencia el formulario para reclamar tu Cívica sin hacer fila.</p>
      <a class="btn btn-bloque" href="/Project/ModuloUser.html">Ir a solicitar mi Cívica</a>
    </section>

    <div id="error" class="alerta error" role="alert"></div>
  </main>

  <script src="/Project/js/util.js"></script>
  <script>
    const mensajes = {
      PENDIENTE: 'Recibimos tu solicitud. Vuelve a esta página para saber cuándo tu Cívica esté lista.',
      CONFIRMADO: 'Tu Cívica está lista. Ve al punto de atención elegido y presenta tu documento de identidad.',
      ENTREGADO: 'Ya reclamaste tu Cívica.'
    };

    pedirJSON('/solicitud-usuario').then(({ ok, status, datos }) => {
      if (status === 401) return (window.location.href = '/Project/InicioSesion.html');
      if (!ok) throw new Error('Error consultando la solicitud');

      if (!datos.existe) {
        document.getElementById('noSolicitud').hidden = false;
        return;
      }
      document.getElementById('info').hidden = false;
      document.getElementById('aviso').textContent = mensajes[datos.Estado] || '';
      document.getElementById('otraSolicitud').hidden = datos.Estado !== 'ENTREGADO';
      document.getElementById('datosSolicitud').innerHTML = `
        <tr><th>Nombre</th><td>${esc(datos.Nombre)}</td></tr>
        <tr><th>Apellido</th><td>${esc(datos.Apellido)}</td></tr>
        <tr><th>Cédula</th><td>${esc(datos.Cedula)}</td></tr>
        <tr><th>Correo</th><td>${esc(datos.Correo)}</td></tr>
        <tr><th>Punto de atención</th><td>${esc(datos.Nombre_Sucursal)}</td></tr>
        <tr><th>Estado</th><td><span class="estado estado-${esc(datos.Estado)}">${esc(datos.Estado)}</span></td></tr>
        <tr><th>Código de solicitud</th><td class="codigo">${esc(datos.Codigo_Barras)}</td></tr>
      `;
    }).catch(() => mostrarAlerta(document.getElementById('error'), 'error', 'No se pudo obtener la información de tu solicitud.'));
  </script>
</body>

</html>
