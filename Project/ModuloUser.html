<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitar Cívica - CívicaYa</title>
  <link rel="stylesheet" href="/Project/css/estilos.css">
</head>

<body>
  <header>
    <nav class="topbar">
      <a href="/">INICIO</a>
      <a href="/Project/ModuloUser.html" class="activo">SOLICITAR CÍVICA</a>
      <a href="/logout">CERRAR SESIÓN</a>
    </nav>
    <div class="brandbar">
      <a class="brand" href="/"><span>Cívica<b>Ya</b></span></a>
      <img class="metro" src="/Project/img/logo-metro.jpg" alt="Metro de Medellín">
    </div>
    <div class="divider"></div>
  </header>

  <main>
    <form id="formSolicitud" class="card ancha" novalidate>
      <h2>Formulario Tarjeta Cívica</h2>
      <div id="alerta" role="alert"></div>

      <div class="fila">
        <div>
          <label class="requerido" for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" maxlength="60" autocomplete="given-name" required>
        </div>
        <div>
          <label class="requerido" for="apellido">Apellido</label>
          <input type="text" id="apellido" name="apellido" maxlength="60" autocomplete="family-name" required>
        </div>
      </div>

      <div class="fila">
        <div>
          <label class="requerido" for="cedula">Número de identificación</label>
          <input type="text" id="cedula" name="cedula" inputmode="numeric" maxlength="10" required>
        </div>
        <div>
          <label class="requerido" for="fecha_nacimiento">Fecha de nacimiento</label>
          <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" min="1900-01-01" required>
        </div>
      </div>

      <label class="requerido" for="correo">Correo electrónico</label>
      <input type="email" id="correo" name="correo" readonly>

      <div class="fila">
        <div>
          <label class="requerido" for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono" inputmode="numeric" maxlength="12" autocomplete="tel" required>
        </div>
        <div>
          <label for="direccion">Dirección</label>
          <input type="text" id="direccion" name="direccion" maxlength="150" autocomplete="street-address">
        </div>
      </div>

      <label class="requerido" for="sucursal">Punto de atención para reclamar (PAC)</label>
      <select id="sucursal" name="sucursal" required>
        <option value="">Selecciona un punto de atención</option>
      </select>

      <fieldset class="grupo-opciones">
        <legend class="requerido">¿Es la primera vez que solicitas la Tarjeta Cívica?</legend>
        <label class="opcion"><input type="radio" name="primera_vez" value="SI" required> Sí, es mi primera tarjeta</label>
        <label class="opcion"><input type="radio" name="primera_vez" value="NO" required> No, ya la he tenido antes</label>
      </fieldset>

      <div id="bloqueReposicion" hidden>
        <label class="requerido" for="motivo_solicitud">Motivo de la solicitud</label>
        <select id="motivo_solicitud" name="motivo_solicitud">
          <option value="">Selecciona un motivo</option>
          <option value="ROBO">Robo</option>
          <option value="PERDIDA">Pérdida</option>
          <option value="DANO">Daño</option>
        </select>

        <fieldset class="grupo-opciones">
          <legend class="requerido">¿Cómo vas a pagar la reposición?</legend>
          <label class="opcion"><input type="radio" name="metodo_pago" value="PSE"> PSE, en línea</label>
          <label class="opcion"><input type="radio" name="metodo_pago" value="EFECTIVO"> Efectivo, al llegar al punto de atención</label>
        </fieldset>
      </div>

      <label for="tipo_tarifa">Tipo de tarifa</label>
      <select id="tipo_tarifa" name="tipo_tarifa">
        <option value="ESTANDAR">Estándar</option>
        <option value="ADULTO_MAYOR">Adulto mayor</option>
        <option value="DISCAPACIDAD">Persona con discapacidad</option>
      </select>
      <p class="ayuda">Si eliges una tarifa especial, presenta el soporte correspondiente el día de tu cita.</p>

      <div id="selectorCita"></div>

      <!-- TODO producción: enlazar la política de tratamiento de datos completa -->
      <label class="casilla" for="acepta_datos">
        <input type="checkbox" id="acepta_datos" name="acepta_datos" required>
        <span>Autorizo el tratamiento de mis datos personales, conforme a la Ley 1581 de 2012, solo para gestionar la entrega de mi Cívica.</span>
      </label>

      <button type="submit" class="btn btn-bloque">Registrar solicitud y reservar cita</button>
    </form>

  </main>

  <script src="/Project/js/util.js"></script>
  <script src="/Project/js/citas.js"></script>
  <script>
    const form = document.getElementById('formSolicitud');
    const alerta = document.getElementById('alerta');
    const boton = form.querySelector('button[type="submit"]');

    const EDAD_MINIMA_ADULTO_MAYOR = 60;
    // Edad cumplida hoy a partir de 'AAAA-MM-DD'
    function calcularEdad(fechaNacimiento) {
      const hoy = new Date();
      const [anio, mes, dia] = fechaNacimiento.split('-').map(Number);
      let edad = hoy.getFullYear() - anio;
      const noHaCumplidoEsteAnio = hoy.getMonth() + 1 < mes || (hoy.getMonth() + 1 === mes && hoy.getDate() < dia);
      if (noHaCumplidoEsteAnio) edad--;
      return edad;
    }
    // «Continuar» lleva a la autorización de datos, el último paso antes de enviar
    const cita = crearSelectorCita(document.getElementById('selectorCita'), {
      onContinuar: () => {
        form.acepta_datos.scrollIntoView({ block: 'center', behavior: 'smooth' });
        form.acepta_datos.focus({ preventScroll: true });
      }
    });

    form.sucursal.addEventListener('change', () => cita.cargar(form.sucursal.value));

    // El motivo y la forma de pago solo aplican si no es la primera tarjeta
    const bloqueReposicion = document.getElementById('bloqueReposicion');
    form.primera_vez.forEach((radio) => radio.addEventListener('change', () => {
      const esReposicion = form.primera_vez.value === 'NO';
      bloqueReposicion.hidden = !esReposicion;
      if (!esReposicion) {
        form.motivo_solicitud.value = '';
        form.metodo_pago.forEach((r) => { r.checked = false; });
      }
    }));

    // Si ya tiene una solicitud en curso, se le muestra su estado en lugar del formulario
    Promise.all([
      pedirJSON('/usuario-actual'),
      pedirJSON('/solicitud-usuario'),
      cargarPuntos(form.sucursal)
    ]).then(([sesion, solicitud, puntosOk]) => {
      if (!sesion.ok) return (window.location.href = '/Project/InicioSesion.html');
      if (solicitud.datos.existe && !['ENTREGADO', 'CANCELADA'].includes(solicitud.datos.Estado)) {
        return (window.location.href = '/Project/ModuloUC.html');
      }
      form.correo.value = sesion.datos.correo;
      if (!puntosOk) mostrarAlerta(alerta, 'error', 'No se pudieron cargar los puntos de atención. Recarga la página.');
    }).catch(() => mostrarAlerta(alerta, 'error', 'No se pudo conectar con el servidor.'));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const datos = {
        nombre: form.nombre.value.trim(),
        apellido: form.apellido.value.trim(),
        cedula: form.cedula.value.trim(),
        fecha_nacimiento: form.fecha_nacimiento.value,
        telefono: form.telefono.value.trim(),
        direccion: form.direccion.value.trim(),
        sucursal: form.sucursal.value,
        primera_vez: form.primera_vez.value || '',
        motivo_solicitud: form.motivo_solicitud.value,
        metodo_pago: form.metodo_pago.value || '',
        tipo_tarifa: form.tipo_tarifa.value
      };

      if (!datos.nombre || !datos.apellido || !datos.cedula || !datos.fecha_nacimiento || !datos.telefono || !datos.sucursal) {
        return mostrarAlerta(alerta, 'error', 'Por favor, completa todos los campos obligatorios.');
      }
      if (!datos.primera_vez) {
        return mostrarAlerta(alerta, 'error', 'Indica si es la primera vez que solicitas la Tarjeta Cívica.');
      }
      if (datos.primera_vez === 'NO' && (!datos.motivo_solicitud || !datos.metodo_pago)) {
        return mostrarAlerta(alerta, 'error', 'Indica el motivo de tu solicitud y cómo vas a pagar la reposición.');
      }
      const elegida = cita.valor();
      if (!elegida) return mostrarAlerta(alerta, 'error', 'Elige el día y la hora de tu cita.');
      if (!form.acepta_datos.checked) {
        return mostrarAlerta(alerta, 'error', 'Debes autorizar el tratamiento de tus datos personales.');
      }
      datos.fecha = elegida.fecha;
      datos.hora = elegida.hora;
      datos.acepta_datos = true;
      if (!/^\d{6,10}$/.test(datos.cedula)) {
        return mostrarAlerta(alerta, 'error', 'La cédula debe tener entre 6 y 10 dígitos numéricos.');
      }
      if (!/^\d{7,12}$/.test(datos.telefono)) {
        return mostrarAlerta(alerta, 'error', 'El teléfono debe tener entre 7 y 12 dígitos numéricos.');
      }
      if (datos.fecha_nacimiento > new Date().toISOString().slice(0, 10)) {
        return mostrarAlerta(alerta, 'error', 'La fecha de nacimiento no puede ser futura.');
      }
      if (datos.tipo_tarifa === 'ADULTO_MAYOR' && calcularEdad(datos.fecha_nacimiento) < EDAD_MINIMA_ADULTO_MAYOR) {
        return mostrarAlerta(alerta, 'error', `La tarifa de adulto mayor solo aplica desde los ${EDAD_MINIMA_ADULTO_MAYOR} años.`);
      }

      boton.disabled = true;
      try {
        const { ok, status, datos: respuesta } = await enviarJSON('/registrar-solicitud', datos);
        if (ok && respuesta.redirect) {
          mostrarAlerta(alerta, 'exito', respuesta.mensaje || 'Solicitud registrada exitosamente.');
          setTimeout(() => { window.location.href = respuesta.redirect; }, 1500);
        } else {
          mostrarAlerta(alerta, 'error', respuesta.mensaje || 'Ocurrió un error inesperado.');
          boton.disabled = false;
          if (status === 409) cita.recargar(); // otra persona pudo tomar esa hora
        }
      } catch {
        mostrarAlerta(alerta, 'error', 'No se pudo conectar con el servidor.');
        boton.disabled = false;
      }
    });
  </script>
</body>

</html>
